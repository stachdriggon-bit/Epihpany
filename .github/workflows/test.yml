name: EPIPHANY checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: epiphany-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax before browser tests
        run: |
          node --check app.js
          node --check cards.js
          node --check data-cards.js
          node --check data-character-profiles.js
          node --check service-worker.js\n          node --check asset-manager.js
          node --check navigation-enhancements.js
          node --check data.js
          node --check data-expansion.js
          node --check think-lab.js
      - name: Run unit, static, and browser smoke tests
        run: npm test
      - name: Upload card dossier visual verification screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: card-dossier-visual-checks
          path: test-results/card-dossier/
          if-no-files-found: ignore
