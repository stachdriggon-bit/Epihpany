name: EPIPHANY checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: epiphany-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python for development-only card thumbnails
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install thumbnail tooling
        run: python -m pip install Pillow
      - name: Generate card gallery thumbnails
        run: python tools/make-card-thumbs.py
      - name: Commit generated thumbnails to the pull request branch
        id: thumbnails
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-cards.js assets/cards/art/thumb
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Generate optimized card gallery thumbnails'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax before browser tests
        run: |
          node --check app.js
          node --check cards.js
          node --check data-cards.js
          node --check service-worker.js
          node --check navigation-enhancements.js
          node --check data.js
          node --check data-expansion.js
          node --check think-lab.js
      - name: Check thumbnail generator syntax
        run: python -m py_compile tools/make-card-thumbs.py
      - name: Run unit, static, and browser smoke tests
        run: npm test
      - name: Upload card dossier visual verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-dossier-visual-checks
          path: test-results/card-dossier/
          if-no-files-found: warn
      - name: Verify the generated-thumbnail commit on its new head SHA
        if: steps.thumbnails.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test.yml',
              ref: process.env.GITHUB_HEAD_REF
            });
