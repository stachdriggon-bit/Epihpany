name: EPIPHANY checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: epiphany-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax before browser tests
        run: |
          node --check app.js
          node --check cards.js
          node --check data-cards.js
          node --check service-worker.js
          node --check navigation-enhancements.js
          node --check data.js
          node --check data-expansion.js
          node --check think-lab.js
      - name: Check thumbnail generator syntax
        run: python -m py_compile tools/make-card-thumbs.py
      - name: Run unit, static, and browser smoke tests
        run: npm test
      - name: Upload card dossier visual verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-dossier-visual-checks
          path: test-results/card-dossier/
          if-no-files-found: warn
