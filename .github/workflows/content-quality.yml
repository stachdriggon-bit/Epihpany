name: Content quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  content-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run automated content tests
        run: |
          node --test tests/content-quality.test.js
