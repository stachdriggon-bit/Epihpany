name: Content quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  content-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run automated content tests
        run: |
          node --test tests/content-quality.test.js
