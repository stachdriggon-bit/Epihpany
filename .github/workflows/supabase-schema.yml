name: Supabase schema reconstruction

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase-schema.yml"]
  pull_request:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase-schema.yml"]
  workflow_dispatch:

concurrency:
  group: epiphany-supabase-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-room-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Verify CLI version
        run: |
          supabase --version
          test "$(supabase --version)" = "3.1.0"
      - name: Disable automatic migration replay until the legacy foundation exists
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/config.toml')
          s = p.read_text()
          s = s.replace('[db.migrations]\nenabled = true', '[db.migrations]\nenabled = false')
          p.write_text(s)
          PY

      - name: Start disposable local Supabase stack
        timeout-minutes: 15
        run: supabase start -x studio,mail,analytics,functions,realtime,pooler
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply legacy foundation and replay migrations
        timeout-minutes: 12
        run: |
          eval "$(supabase status -o env)"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/bootstrap/legacy_foundation.sql
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/config.toml')
          s = p.read_text()
          s = s.replace('[db.migrations]\nenabled = false', '[db.migrations]\nenabled = true')
          p.write_text(s)
          PY
          supabase migration up
      - name: Assert clean-room schema
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase0_schema_assertions.sql

      - name: Assert Phase 1 wallet security and transaction contract
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          grep -Fq 'schemas = ["public", "graphql_public"]' supabase/config.toml
          ! grep -q 'economy_private' supabase/config.toml
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase1_wallet_assertions.sql

      - name: Assert Phase 2 validated-event and claim foundation
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase2_event_claim_assertions.sql

      - name: Assert Phase 3 trusted game validator contract
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase3_odd_one_out_validator_assertions.sql

      - name: Verify concurrent wallet idempotency and debit serialization
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase1_concurrency_setup.sql

          set +e
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "SELECT set_config('request.jwt.claim.role','service_role',false); SELECT * FROM public.economy_post_wallet_transaction('f1000000-0000-4000-8000-000000000021',100,'credit','test','concurrent-credit','f1000000-0000-4000-8000-000000000022','Concurrent idempotent credit',NULL,'{}'::jsonb);" > /tmp/velorn-credit-a.log 2>&1 &
          credit_a_pid=$!
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "SELECT set_config('request.jwt.claim.role','service_role',false); SELECT * FROM public.economy_post_wallet_transaction('f1000000-0000-4000-8000-000000000021',100,'credit','test','concurrent-credit','f1000000-0000-4000-8000-000000000022','Concurrent idempotent credit',NULL,'{}'::jsonb);" > /tmp/velorn-credit-b.log 2>&1 &
          credit_b_pid=$!
          wait "$credit_a_pid"; credit_a_status=$?
          wait "$credit_b_pid"; credit_b_status=$?

          if [ "$credit_a_status" -ne 0 ] || [ "$credit_b_status" -ne 0 ]; then
            cat /tmp/velorn-credit-a.log /tmp/velorn-credit-b.log
            echo "Both identical concurrent credits must succeed idempotently."
            exit 1
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "SELECT set_config('request.jwt.claim.role','service_role',false); SELECT * FROM public.economy_post_wallet_transaction('f1000000-0000-4000-8000-000000000021',-70,'debit','test','concurrent-debit-a','f1000000-0000-4000-8000-000000000023','Concurrent debit A',NULL,'{}'::jsonb);" > /tmp/velorn-debit-a.log 2>&1 &
          debit_a_pid=$!
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "SELECT set_config('request.jwt.claim.role','service_role',false); SELECT * FROM public.economy_post_wallet_transaction('f1000000-0000-4000-8000-000000000021',-70,'debit','test','concurrent-debit-b','f1000000-0000-4000-8000-000000000024','Concurrent debit B',NULL,'{}'::jsonb);" > /tmp/velorn-debit-b.log 2>&1 &
          debit_b_pid=$!
          wait "$debit_a_pid"; debit_a_status=$?
          wait "$debit_b_pid"; debit_b_status=$?
          set -e

          if { [ "$debit_a_status" -eq 0 ] && [ "$debit_b_status" -eq 0 ]; } || { [ "$debit_a_status" -ne 0 ] && [ "$debit_b_status" -ne 0 ]; }; then
            cat /tmp/velorn-debit-a.log /tmp/velorn-debit-b.log
            echo "Exactly one concurrent debit may succeed with 100 Velorn and two 70-Velorn requests."
            exit 1
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.role', 'service_role', false);
          DO $velorn_phase1$
          DECLARE
            v_balance bigint;
            v_entries integer;
            v_mismatches integer;
          BEGIN
            SELECT balance INTO v_balance
            FROM economy_private.wallets
            WHERE user_id = 'f1000000-0000-4000-8000-000000000021';
            SELECT count(*) INTO v_entries
            FROM economy_private.wallet_ledger
            WHERE user_id = 'f1000000-0000-4000-8000-000000000021';
            SELECT count(*) INTO v_mismatches FROM public.economy_reconcile_wallets();
            IF v_balance <> 30 OR v_entries <> 2 OR v_mismatches <> 0 THEN
              RAISE EXCEPTION 'Concurrent wallet contract failed: balance %, entries %, mismatches %',
                v_balance, v_entries, v_mismatches;
            END IF;
          END;
          $velorn_phase1$;
          SQL

      - name: Compare complete local catalog with hosted reference snapshot
        timeout-minutes: 5
        run: |
          set -o pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -At -v ON_ERROR_STOP=1 -f supabase/tests/phase0_catalog_snapshot.sql | jq -cS . > /tmp/epiphany-local-catalog.json
          jq -cS . supabase/tests/phase0_expected_catalog.json > /tmp/epiphany-expected-catalog.json
          diff -u /tmp/epiphany-expected-catalog.json /tmp/epiphany-local-catalog.json

      - name: Upload catalog diff inputs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: supabase-phase0-catalog-comparison
          path: |
            /tmp/epiphany-local-catalog.json
            /tmp/epiphany-expected-catalog.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop disposable local stack
        if: always()
        run: supabase stop --no-backup
