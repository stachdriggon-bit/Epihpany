name: Supabase schema reconstruction

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase-schema.yml"]
  pull_request:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase-schema.yml"]
  workflow_dispatch:

concurrency:
  group: epiphany-supabase-schema-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  clean-room-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Verify CLI version
        run: |
          supabase --version
          test "$(supabase --version)" = "3.1.0"
      - name: Disable automatic migration replay until the legacy foundation exists
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/config.toml')
          s = p.read_text()
          s = s.replace('[db.migrations]\nenabled = true', '[db.migrations]\nenabled = false')
          p.write_text(s)
          PY

      - name: Validate SQL fixture UUID literals before starting Supabase
        run: node --test tests/sql-uuid-fixtures.test.js

      - name: Start disposable local Supabase stack
        timeout-minutes: 15
        run: supabase start -x studio,mail,analytics,realtime,pooler
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply legacy foundation and replay migrations
        timeout-minutes: 12
        run: |
          eval "$(supabase status -o env)"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/bootstrap/legacy_foundation.sql
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/config.toml')
          s = p.read_text()
          s = s.replace('[db.migrations]\nenabled = false', '[db.migrations]\nenabled = true')
          p.write_text(s)
          PY
          supabase migration up
      - name: Assert clean-room schema
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase0_schema_assertions.sql

      - name: Assert Phase 1 wallet security and transaction contract
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          grep -Fq 'schemas = ["public", "graphql_public"]' supabase/config.toml
          ! grep -q 'economy_private' supabase/config.toml
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase1_wallet_assertions.sql

      - name: Assert Phase 2 validated-event and claim foundation
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase2_event_claim_assertions.sql

      - name: Assert Phase 4A atomic mission claim contract
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase4a_atomic_mission_claim_assertions.sql

      - name: Assert Phase 3 trusted game validator contract
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase3_odd_one_out_validator_assertions.sql

      - name: Assert Phase 3 guest validator isolation contract
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase3_guest_validator_assertions.sql

      - name: Assert Phase 4C timezone and DST-safe period contract
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase4c_period_timezone_assertions.sql

      - name: Assert Phase 4D trusted mission predicate mapping
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase4d_mission_predicate_assertions.sql

      - name: Assert Phase 4E trusted mission progress processor
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase4e_mission_progress_assertions.sql

      - name: Assert Phase 4F safe mission board generation
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase4f_mission_board_generation_assertions.sql

      - name: Assert Phase 4G first verified mission predicate
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase4g_first_verified_mission_predicate_assertions.sql

      - name: Assert Phase 4H Word Forge server validator and guest isolation
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase4h_word_forge_validator_assertions.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase4i_word_forge_mission_predicate_assertions.sql

      - name: Assert Phase 5A unified Think Lab validator session foundation
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase5a_unified_validator_session_assertions.sql

      - name: Assert Phase 5B unified Think Lab answer transition
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase5b_unified_answer_transition_assertions.sql

      - name: Assert Phase 5E Chain Reaction unified validator
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase5e_chain_reaction_validator_assertions.sql

      - name: Assert Phase 5F Sentence Scramble unified validator
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase5f_sentence_scramble_validator_assertions.sql

      - name: Run unified Think Lab guest and authenticated Edge Function parity tests
        timeout-minutes: 8
        run: |
          eval "$(supabase status -o env)"
          cat > /tmp/think-lab-unified.env <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF

          supabase functions serve velorn-think-lab-validator --no-verify-jwt --env-file /tmp/think-lab-unified.env > /tmp/think-lab-unified-edge.log 2>&1 &
          echo $! > /tmp/think-lab-unified-edge.pid

          ready=false
          for attempt in $(seq 1 45); do
            status=$(curl --silent --show-error --output /tmp/think-lab-unified-ready.json --write-out '%{http_code}' \
              --request POST "$API_URL/functions/v1/velorn-think-lab-validator" \
              --header "apikey: $ANON_KEY" \
              --header "content-type: application/json" \
              --data '{"action":"start","gameId":"readiness-check"}' || true)
            if [ "$status" = "400" ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/think-lab-unified-edge.log
            cat /tmp/think-lab-unified-ready.json || true
            echo "Unified Think Lab Edge Function did not become ready."
            exit 1
          fi

          if ! THINK_LAB_E2E_RESULT_FILE=/tmp/think-lab-unified-e2e.json \
            SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node supabase/tests/think-lab-unified-edge-e2e.cjs; then
            echo "Unified Think Lab Edge Function logs:"
            cat /tmp/think-lab-unified-edge.log || true
            exit 1
          fi

          USER_ID=$(node -p "require('/tmp/think-lab-unified-e2e.json').userId")
          GUEST_WF=$(node -p "require('/tmp/think-lab-unified-e2e.json').guestWordForge")
          AUTH_WF=$(node -p "require('/tmp/think-lab-unified-e2e.json').authWordForge")
          GUEST_OOO=$(node -p "require('/tmp/think-lab-unified-e2e.json').guestOddOneOut")
          AUTH_OOO=$(node -p "require('/tmp/think-lab-unified-e2e.json').authOddOneOut")
          GUEST_CHAIN=$(node -p "require('/tmp/think-lab-unified-e2e.json').guestChainReaction")
          AUTH_DAILY_CHAIN=$(node -p "require('/tmp/think-lab-unified-e2e.json').authDailyChainReaction")
          GUEST_SENTENCE=$(node -p "require('/tmp/think-lab-unified-e2e.json').guestSentenceScramble")
          AUTH_DAILY_SENTENCE=$(node -p "require('/tmp/think-lab-unified-e2e.json').authDailySentenceScramble")

          AUTH_WF_EVENTS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v user_id="$USER_ID" -v session_id="$AUTH_WF" <<'SQL'
          SELECT count(*) FROM economy_private.activity_events
          WHERE user_id=:'user_id'::uuid AND source_event_key=:'session_id'::uuid
            AND activity_id='word_forge' AND event_type='game_session_completed'
            AND validator_version='word-forge-reviewed-72-20261111-v1';
          SQL
          )
          AUTH_OOO_EVENTS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v user_id="$USER_ID" -v session_id="$AUTH_OOO" <<'SQL'
          SELECT count(*) FROM economy_private.activity_events
          WHERE user_id=:'user_id'::uuid AND source_event_key=:'session_id'::uuid
            AND activity_id='odd_one_out' AND event_type='game_session_completed'
            AND validator_version='odd-one-out-rotated-20261110-v2';
          SQL
          )
          AUTH_CHAIN_EVENTS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v user_id="$USER_ID" -v session_id="$AUTH_DAILY_CHAIN" <<'SQL'
          SELECT count(*) FROM economy_private.activity_events
          WHERE user_id=:'user_id'::uuid AND source_event_key=:'session_id'::uuid
            AND activity_id='chain_reaction' AND event_type='game_session_completed'
            AND validator_version='chain-reaction-72-20261112-v1'
            AND evidence->>'session_type'='daily' AND evidence->>'question_count'='1'
            AND evidence->>'link_count'='3' AND evidence->>'wrong_link_attempts'='1';
          SQL
          )
          AUTH_SENTENCE_EVENTS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v user_id="$USER_ID" -v session_id="$AUTH_DAILY_SENTENCE" <<'SQL'
          SELECT count(*) FROM economy_private.activity_events
          WHERE user_id=:'user_id'::uuid AND source_event_key=:'session_id'::uuid
            AND activity_id='sentence_scramble' AND event_type='game_session_completed'
            AND validator_version='sentence-scramble-72-20261112-v1'
            AND evidence->>'session_type'='daily' AND evidence->>'question_count'='1'
            AND evidence->>'wrong_attempts'='1';
          SQL
          )
          GUEST_EVENTS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v wf="$GUEST_WF" -v ooo="$GUEST_OOO" -v chain="$GUEST_CHAIN" -v sentence="$GUEST_SENTENCE" <<'SQL'
          SELECT count(*) FROM economy_private.activity_events
          WHERE source_event_key IN (:'wf'::uuid, :'ooo'::uuid, :'chain'::uuid, :'sentence'::uuid);
          SQL
          )
          SESSION_OWNERSHIP=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v user_id="$USER_ID" -v guest_wf="$GUEST_WF" -v auth_wf="$AUTH_WF" -v guest_ooo="$GUEST_OOO" -v auth_ooo="$AUTH_OOO" -v guest_chain="$GUEST_CHAIN" -v auth_chain="$AUTH_DAILY_CHAIN" -v guest_sentence="$GUEST_SENTENCE" -v auth_sentence="$AUTH_DAILY_SENTENCE" <<'SQL'
          SELECT
            (SELECT count(*) FROM economy_private.think_lab_validator_sessions
             WHERE session_id IN (:'guest_wf'::uuid, :'guest_ooo'::uuid, :'guest_chain'::uuid, :'guest_sentence'::uuid)
               AND user_id IS NULL AND guest_token_hash IS NOT NULL AND client_ip_hash IS NOT NULL)
            || ':' ||
            (SELECT count(*) FROM economy_private.think_lab_validator_sessions
             WHERE session_id IN (:'auth_wf'::uuid, :'auth_ooo'::uuid, :'auth_chain'::uuid, :'auth_sentence'::uuid)
               AND user_id=:'user_id'::uuid AND guest_token_hash IS NULL AND client_ip_hash IS NULL);
          SQL
          )
          REWARD_ROWS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v user_id="$USER_ID" <<'SQL'
          SELECT (SELECT count(*) FROM economy_private.wallets WHERE user_id=:'user_id'::uuid)
               + (SELECT count(*) FROM economy_private.wallet_ledger WHERE user_id=:'user_id'::uuid)
               + (SELECT count(*) FROM economy_private.mission_reward_claims WHERE user_id=:'user_id'::uuid)
               + (SELECT count(*) FROM economy_private.achievement_awards WHERE user_id=:'user_id'::uuid);
          SQL
          )
          ECONOMY_ENABLED=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -c "SELECT economy_enabled FROM economy_private.economy_settings WHERE singleton=true;")

          test "$AUTH_WF_EVENTS" = "1"
          test "$AUTH_OOO_EVENTS" = "1"
          test "$AUTH_CHAIN_EVENTS" = "1"
          test "$AUTH_SENTENCE_EVENTS" = "1"
          test "$GUEST_EVENTS" = "0"
          test "$SESSION_OWNERSHIP" = "4:4"
          test "$REWARD_ROWS" = "0"
          test "$ECONOMY_ENABLED" = "f"

          # Stop the unified Edge Runtime before starting the legacy Word Forge
          # runtime in the next step. Both `functions serve` commands otherwise
          # compete for the same local Edge Runtime container.
          if [ -f /tmp/think-lab-unified-edge.pid ]; then
            unified_edge_pid=$(cat /tmp/think-lab-unified-edge.pid)
            kill "$unified_edge_pid" 2>/dev/null || true
            wait "$unified_edge_pid" 2>/dev/null || true
            rm -f /tmp/think-lab-unified-edge.pid
          fi
          sleep 2

      - name: Run Word Forge guest and authenticated Edge Function end-to-end tests
        timeout-minutes: 7
        run: |
          eval "$(supabase status -o env)"
          cat > /tmp/word-forge.env <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF

          supabase functions serve velorn-word-forge --no-verify-jwt --env-file /tmp/word-forge.env > /tmp/word-forge-edge.log 2>&1 &
          echo $! > /tmp/word-forge-edge.pid

          ready=false
          for attempt in $(seq 1 45); do
            status=$(curl --silent --show-error --output /tmp/word-forge-ready.json --write-out '%{http_code}' \
              --request POST "$API_URL/functions/v1/velorn-word-forge" \
              --header "apikey: $ANON_KEY" \
              --header "content-type: application/json" \
              --data '{"action":"readiness-check"}' || true)
            if [ "$status" = "400" ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/word-forge-edge.log
            cat /tmp/word-forge-ready.json || true
            echo "Word Forge local Edge Function did not become ready."
            exit 1
          fi

          if ! WORD_FORGE_E2E_RESULT_FILE=/tmp/word-forge-e2e.json \
            SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node supabase/tests/word-forge-edge-e2e.cjs; then
            echo "Word Forge Edge Function logs:"
            cat /tmp/word-forge-edge.log || true
            exit 1
          fi

          USER_ID=$(node -p "require('/tmp/word-forge-e2e.json').userId")
          GUEST_SESSION_ID=$(node -p "require('/tmp/word-forge-e2e.json').guestSessionId")
          AUTH_SESSION_ID=$(node -p "require('/tmp/word-forge-e2e.json').authenticatedSessionId")

          AUTH_EVENTS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v user_id="$USER_ID" -v session_id="$AUTH_SESSION_ID" <<'SQL'
          SELECT count(*) FROM economy_private.activity_events
          WHERE user_id=:'user_id'::uuid
            AND source_event_key=:'session_id'::uuid
            AND activity_id='word_forge'
            AND event_type='game_session_completed'
            AND validator_version='word-forge-reviewed-72-20261111-v1';
          SQL
          )
          GUEST_EVENTS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v session_id="$GUEST_SESSION_ID" <<'SQL'
          SELECT count(*) FROM economy_private.activity_events
          WHERE source_event_key=:'session_id'::uuid;
          SQL
          )
          REWARD_ROWS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v user_id="$USER_ID" <<'SQL'
          SELECT (SELECT count(*) FROM economy_private.wallets WHERE user_id=:'user_id'::uuid)
               + (SELECT count(*) FROM economy_private.wallet_ledger WHERE user_id=:'user_id'::uuid)
               + (SELECT count(*) FROM economy_private.mission_reward_claims WHERE user_id=:'user_id'::uuid)
               + (SELECT count(*) FROM economy_private.achievement_awards WHERE user_id=:'user_id'::uuid);
          SQL
          )
          GUEST_SESSIONS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v session_id="$GUEST_SESSION_ID" <<'SQL'
          SELECT count(*) FROM economy_private.word_forge_validator_sessions
          WHERE session_id=:'session_id'::uuid
            AND user_id IS NULL
            AND guest_token_hash IS NOT NULL
            AND length(guest_token_hash)=64;
          SQL
          )
          AUTH_SESSIONS=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -v user_id="$USER_ID" -v session_id="$AUTH_SESSION_ID" <<'SQL'
          SELECT count(*) FROM economy_private.word_forge_validator_sessions
          WHERE session_id=:'session_id'::uuid
            AND user_id=:'user_id'::uuid
            AND guest_token_hash IS NULL;
          SQL
          )
          ECONOMY_ENABLED=$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -c "SELECT economy_enabled FROM economy_private.economy_settings WHERE singleton=true;")

          test "$AUTH_EVENTS" = "1"
          test "$GUEST_EVENTS" = "0"
          test "$REWARD_ROWS" = "0"
          test "$GUEST_SESSIONS" = "1"
          test "$AUTH_SESSIONS" = "1"
          test "$ECONOMY_ENABLED" = "f"

      - name: Verify concurrent wallet idempotency and debit serialization
        timeout-minutes: 5
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/phase1_concurrency_setup.sql

          set +e
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "SELECT set_config('request.jwt.claim.role','service_role',false); SELECT * FROM public.economy_post_wallet_transaction('f1000000-0000-4000-8000-000000000021',100,'credit','test','concurrent-credit','f1000000-0000-4000-8000-000000000022','Concurrent idempotent credit',NULL,'{}'::jsonb);" > /tmp/velorn-credit-a.log 2>&1 &
          credit_a_pid=$!
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "SELECT set_config('request.jwt.claim.role','service_role',false); SELECT * FROM public.economy_post_wallet_transaction('f1000000-0000-4000-8000-000000000021',100,'credit','test','concurrent-credit','f1000000-0000-4000-8000-000000000022','Concurrent idempotent credit',NULL,'{}'::jsonb);" > /tmp/velorn-credit-b.log 2>&1 &
          credit_b_pid=$!
          wait "$credit_a_pid"; credit_a_status=$?
          wait "$credit_b_pid"; credit_b_status=$?

          if [ "$credit_a_status" -ne 0 ] || [ "$credit_b_status" -ne 0 ]; then
            cat /tmp/velorn-credit-a.log /tmp/velorn-credit-b.log
            echo "Both identical concurrent credits must succeed idempotently."
            exit 1
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "SELECT set_config('request.jwt.claim.role','service_role',false); SELECT * FROM public.economy_post_wallet_transaction('f1000000-0000-4000-8000-000000000021',-70,'debit','test','concurrent-debit-a','f1000000-0000-4000-8000-000000000023','Concurrent debit A',NULL,'{}'::jsonb);" > /tmp/velorn-debit-a.log 2>&1 &
          debit_a_pid=$!
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "SELECT set_config('request.jwt.claim.role','service_role',false); SELECT * FROM public.economy_post_wallet_transaction('f1000000-0000-4000-8000-000000000021',-70,'debit','test','concurrent-debit-b','f1000000-0000-4000-8000-000000000024','Concurrent debit B',NULL,'{}'::jsonb);" > /tmp/velorn-debit-b.log 2>&1 &
          debit_b_pid=$!
          wait "$debit_a_pid"; debit_a_status=$?
          wait "$debit_b_pid"; debit_b_status=$?
          set -e

          if { [ "$debit_a_status" -eq 0 ] && [ "$debit_b_status" -eq 0 ]; } || { [ "$debit_a_status" -ne 0 ] && [ "$debit_b_status" -ne 0 ]; }; then
            cat /tmp/velorn-debit-a.log /tmp/velorn-debit-b.log
            echo "Exactly one concurrent debit may succeed with 100 Velorn and two 70-Velorn requests."
            exit 1
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.role', 'service_role', false);
          DO $velorn_phase1$
          DECLARE
            v_balance bigint;
            v_entries integer;
            v_mismatches integer;
          BEGIN
            SELECT balance INTO v_balance
            FROM economy_private.wallets
            WHERE user_id = 'f1000000-0000-4000-8000-000000000021';
            SELECT count(*) INTO v_entries
            FROM economy_private.wallet_ledger
            WHERE user_id = 'f1000000-0000-4000-8000-000000000021';
            SELECT count(*) INTO v_mismatches FROM public.economy_reconcile_wallets();
            IF v_balance <> 30 OR v_entries <> 2 OR v_mismatches <> 0 THEN
              RAISE EXCEPTION 'Concurrent wallet contract failed: balance %, entries %, mismatches %',
                v_balance, v_entries, v_mismatches;
            END IF;
          END;
          $velorn_phase1$;
          SQL

      - name: Compare complete local catalog with hosted reference snapshot
        timeout-minutes: 5
        run: |
          set -o pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -At -v ON_ERROR_STOP=1 -f supabase/tests/phase0_catalog_snapshot.sql | jq -cS . > /tmp/epiphany-local-catalog.json
          jq -cS . supabase/tests/phase0_expected_catalog.json > /tmp/epiphany-expected-catalog.json
          diff -u /tmp/epiphany-expected-catalog.json /tmp/epiphany-local-catalog.json

      - name: Upload catalog diff inputs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: supabase-phase0-catalog-comparison
          path: |
            /tmp/epiphany-local-catalog.json
            /tmp/epiphany-expected-catalog.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop disposable local stack
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        run: supabase stop --no-backup
