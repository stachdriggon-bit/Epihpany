#:schema https://supabase.com/schemas/config/v1.json
project_id = "epiphany-local"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true
[studio]
enabled = true
port = 54323
[storage]
enabled = true
file_size_limit = "12MiB"

[functions.velorn-odd-one-out]
verify_jwt = true

[functions.velorn-odd-one-out-guest]
verify_jwt = false

[functions.velorn-mission-claims]
verify_jwt = true

[functions.velorn-word-forge]
verify_jwt = false

[functions.velorn-think-lab-validator]
verify_jwt = false

[functions.velorn-player-dashboard]
verify_jwt = true
