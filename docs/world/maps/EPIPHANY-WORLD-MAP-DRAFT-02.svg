  <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7dfbd"/><stop offset="1" stop-color="#c6d0a5"/></linearGradient>
  <style>
    .region{font:700 29px Georgia,serif;letter-spacing:3px;fill:#394d4a;opacity:.9}
    .subregion{font:italic 15px Georgia,serif;fill:#536a65}
    .city{font:15px Arial,sans-serif;fill:#243b46;paint-order:stroke;stroke:#f4f0dd;stroke-width:4px;stroke-linejoin:round}
    .smallcity{font:13px Arial,sans-serif;fill:#243b46;paint-order:stroke;stroke:#f4f0dd;stroke-width:3.5px;stroke-linejoin:round}
    .waterlabel{font:italic 22px Georgia,serif;letter-spacing:2px;fill:#477b8d;opacity:.9}
    .mountain{fill:#aab49b;stroke:#7f907d;stroke-width:1.5}
    .river{fill:none;stroke:#6ca6bf;stroke-width:4;stroke-linecap:round}
    .route{fill:none;stroke:#b77e45;stroke-width:2.5;stroke-dasharray:7 7;opacity:.8}
    .dot{fill:#fbf6dc;stroke:#314f5b;stroke-width:2.5}
    .isle{fill:#d7d9ae;stroke:#899b86;stroke-width:2}
  </style>
</defs>
