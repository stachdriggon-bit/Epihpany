<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">EPIPHANY — World Map Draft 02</title>
<desc id="desc">A schematic, not-to-scale draft showing the relative positions of Ilmar, Orath, Tharima, Nirvan, and the Azmar archipelagos, with thirty approved settlement names.</desc>
<defs>
